# Cloudflare Workers + static assets (free plan)
# The 2026 dashboard runs `npx wrangler deploy` after `npm run build`.
# Do NOT use pages_build_output_dir — that key is Pages-only and causes:
#   "Missing entry-point to Worker script or to assets directory"

name = "prasar"
main = "worker.ts"
compatibility_date = "2026-09-26"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the stream relay hits the Worker; everything else is a static asset.
run_worker_first = ["/proxy", "/proxy*"]
